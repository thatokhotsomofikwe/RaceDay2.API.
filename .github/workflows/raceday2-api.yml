name: RaceDay2.API CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RaceDay2.API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate project file
        id: project
        shell: bash
        run: |
          PROJECT=$(find . \
            -type f \
            -name 'RaceDay2.API.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "RaceDay2.API.csproj was not found."
            echo "Check the project filename and repository."
            exit 1
          fi

          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"

      - name: Restore dependencies
        run: dotnet restore "${{ steps.project.outputs.path }}"

      - name: Build project
        run: >
          dotnet build "${{ steps.project.outputs.path }}"
          --configuration Release
          --no-restore

      - name: Run tests if available
        shell: bash
        run: |
          mapfile -t TEST_PROJECTS < <(
            find . -type f \
              \( -name '*Tests.csproj' -o -name '*Test.csproj' \) \
              -not -path '*/bin/*' \
              -not -path '*/obj/*'
          )

          if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
            echo "No separate test project found. Skipping tests."
          else
            for TEST_PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "Testing $TEST_PROJECT"
              dotnet test "$TEST_PROJECT" \
                --configuration Release
            done
          fi
